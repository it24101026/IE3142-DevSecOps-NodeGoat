name: SAST Security Scan

on:
  push:
    branches:
      - member-1
      - master
  pull_request:
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto